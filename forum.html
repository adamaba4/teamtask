    <main class="main-content">

        <!--  liste des forums -->
        <div id="vue-forums">
            <div class="header">
                <div>
                    <h1>Forum</h1>
                    <div class="header-sub" id="header-welcome">Chargement...</div>
                </div>
                <button class="btn-primary" onclick="ouvrirModalForum()">+ Créer un forum</button>
            </div>
            
            <div class="forums-list" id="forums-list">
                <div class="loading">Veuillez choisir un projet.</div>
            </div>
        </div>


    <!--vue-->
        <div id="vue-posts">
            <div class="posts-header">
                <button class="btn-back" onclick="retourForums()">← Retour</button>
                <div>
                    
                    <h1 id="forum-titre-page">Forum</h1>
                    <div class="header-sub" id="forum-desc-page"></div>
                   
                </div>

                <button class="btn-primary" style="margin-left:auto" onclick="ouvrirModalPost()">+ Ajouter un commentaire</button>
            </div>
            <div id="posts-liste">
                <div class="loading">Chargement des posts...</div>
            </div>
        </div>

        <!-- créer un forum -->
        <div class="modal-overlay" id="modal-forum">
            <div class="modal">
                <div class="modal-header">
                    <h3>Créer un forum</h3>
                    <button class="modal-close" onclick="fermerModal('modal-forum')">✕</button>
                </div>
                <form id="form-forum">
                    <label>Nom du forum *</label>
                    <input type="text" name="content" placeholder="Ex: Questions générales" required>
                    <button type="submit" class="btn-primary" style="width:100%; margin-top:18px;">Créer</button>
                    <p class="modal-msg" id="msg-forum"></p>
                </form>
            </div>
            </div>

            <!--créer un post -->
        <div class="modal-overlay" id="modal-post">
            <div class="modal">
                <div class="modal-header">
                    <h3>Nouveau post</h3>
                    <button class="modal-close" onclick="fermerModal('modal-post')">✕</button>
                </div>
                <form id="form-post">
                    <label>Contenu *</label>
                    <textarea name="content" rows="5" placeholder="Écris ton message..." required></textarea>
                    <button type="submit" class="btn-primary" style="width:100%; margin-top:18px;">Publier</button>
                    <p class="modal-msg" id="msg-post"></p>
                </form>
            </div>
</div>
</div>
